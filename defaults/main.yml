service_id: openbao
service_name: openbao
service_unit_name: openbao
service_image: docker.io/openbao/openbao:2.4.1
version: "2.4.1"
needs_container_runtime: true
service_ip: "{{ openbao_container_ip }}"
service_ports:
  - target: 8200
    published: {{ openbao_service_port }}
    protocol: tcp
service_env:
  - name: VAULT_API_ADDR
    value: "{{ openbao_api_addr }}"
  - name: VAULT_CLUSTER_ADDR
    value: "{{ openbao_cluster_addr }}"
  - name: VAULT_RAFT_NODE_ID
    value: "{{ openbao_effective_raft_node_id }}"
  - name: VAULT_RAFT_PATH
    value: /var/lib/openbao/data
  - name: VAULT_DISABLE_MLOCK
    value: "{{ openbao_disable_mlock | ternary('true', 'false') }}"
  - name: VAULT_LOG_LEVEL
    value: "{{ openbao_log_level }}"
  - name: VAULT_ENABLE_UI
    value: "{{ openbao_enable_ui | ternary('true', 'false') }}"
  - name: OPENBAO_CONFIG_FILE
    value: /etc/openbao/config.d/server.hcl
  - name: OPENBAO_TLS_DISABLE
    value: "{{ openbao_tls_disable | ternary('1', '0') }}"
  - name: TZ
    value: "{{ openbao_timezone }}"
service_volumes:
  - name: config
    source: "{{ openbao_config_volume }}"
    target: /etc/openbao
    driver: local
    size: "{{ openbao_config_volume_size_gb }}Gi"
  - name: data
    source: "{{ openbao_data_volume }}"
    target: /var/lib/openbao/data
    driver: local
    size: "{{ openbao_data_volume_size_gb }}Gi"
service_resources:
  memory_mb: "{{ openbao_container_memory_mb }}"
  cpu_cores: "{{ openbao_container_cpu_cores }}"
service_namespace: "{{ openbao_kubernetes_namespace }}"
service_replicas: "{{ openbao_kubernetes_replicas }}"
service_container:
  vmid: "{{ openbao_container_vmid }}"
  hostname: "{{ service_name }}"
  ostemplate: "{{ openbao_container_template }}"
  disk: "{{ openbao_container_storage_gb }}"
  cores: "{{ openbao_container_cpu_cores }}"
  memory: "{{ openbao_container_memory_mb }}"
  swap: "{{ openbao_container_swap_mb }}"
  bridge: "{{ openbao_container_bridge }}"
  cidr: "{{ openbao_container_cidr }}"
  gateway: "{{ openbao_container_gateway }}"
  interface: "{{ openbao_container_interface }}"
  onboot: yes
  unprivileged: yes
  features: nesting=1,keyctl=1
service_security:
  run_as_user: 1000
  run_as_group: 1000
  read_only_root_filesystem: false
  capabilities_drop:
    - ALL
  no_new_privileges: true
  pod_security_context:
    runAsNonRoot: true
    fsGroup: 1000
service_pod_disruption_budget: "{{ (openbao_production | bool) | ternary({'min_available': 2}, {}) }}"
service_topology_spread_constraints: "{{ (openbao_production | bool) | ternary([
  {
    'topologyKey': 'kubernetes.io/hostname',
    'maxSkew': 1,
    'whenUnsatisfied': 'DoNotSchedule',
    'labelSelector': {
      'matchLabels': {
        'app': service_name
      }
    }
  }
], []) }}"
service_pod_anti_affinity: "{{ (openbao_production | bool) | ternary({
  'requiredDuringSchedulingIgnoredDuringExecution': [
    {
      'topologyKey': 'kubernetes.io/hostname',
      'labelSelector': {
        'matchLabels': {
          'app': service_name
        }
      }
    }
  ]
}, {}) }}"
requires: []
exports:
  env:
    - name: OPENBAO_ADDR
      value: "{{ openbao_external_url }}"
      description: Public API endpoint for clients
    - name: OPENBAO_API_ADDR
      value: "{{ openbao_api_addr }}"
      description: Cluster-internal API address
    - name: OPENBAO_CLUSTER_ADDR
      value: "{{ openbao_cluster_addr }}"
      description: Cluster address for raft peers
mounts:
  persistent_volumes:
    - name: config
      path: /etc/openbao
    - name: data
      path: /var/lib/openbao/data
  ephemeral_mounts:
    - name: openbao-run
      path: /run/openbao
      apply_to: [docker, podman, proxmox, baremetal]
      medium: Memory
      size: 32Mi
      mode: '0755'
    - name: openbao-tmp
      path: /tmp/openbao
      apply_to: [docker, podman, kubernetes, proxmox, baremetal]
      medium: Memory
      size: 64Mi
health:
  liveness:
    cmd:
      - curl
      - -fsS
      - "{{ openbao_health_scheme }}://127.0.0.1:{{ openbao_service_port }}/v1/sys/health?standbyok=true&sealedcode=200"
    interval: 30s
    timeout: 15s
    retries: 5
  readiness:
    cmd:
      - /bin/sh
      - -ec
      - |
        set -euo pipefail
        response=$(curl -sw '\n%{http_code} %{time_total}' "{{ openbao_health_scheme }}://127.0.0.1:{{ openbao_service_port }}/v1/sys/health?standbyok=true" -o /tmp/health.json)
        code=$(printf '%s' "$response" | tail -n1 | awk '{print $1}')
        observed_latency=$(printf '%s' "$response" | tail -n1 | awk '{print $2}')
        body=$(printf '%s\n' "$response" | sed '$d')
        test "$code" = "200"
        if ! printf '%s' "$body" | jq -e '.sealed == false' >/dev/null; then
          echo 'OpenBao node is sealed' >&2
          exit 1
        fi
        if ! printf '%s' "$observed_latency" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
          echo 'Readiness latency missing from response' >&2
          exit 1
        fi
        threshold={{ openbao_readiness_latency_threshold }}
        if ! awk -v lat="$observed_latency" -v threshold="$threshold" 'BEGIN {exit !(lat <= threshold)}'; then
          printf 'Readiness latency %.3fs exceeds threshold %.3fs\n' "$observed_latency" "$threshold" >&2
          exit 1
        fi
    interval: 15s
    timeout: 15s
    retries: 3
  startup:
    cmd:
      - curl
      - -fsS
      - "{{ openbao_health_scheme }}://127.0.0.1:{{ openbao_service_port }}/v1/sys/health?standbyok=true&sealedcode=200"
    interval: 30s
    timeout: 30s
    failure_threshold: 10
storage:
  - name: config
    path: /etc/openbao
    size: "{{ openbao_config_volume_size_gb }}G"
  - name: data
    path: /var/lib/openbao/data
    size: "{{ openbao_data_volume_size_gb }}G"
runtime_templates:
  proxmox: proxmox.yml.j2
  docker: docker.yml.j2
  podman: podman.yml.j2
  kubernetes: kubernetes.yml.j2
  baremetal: baremetal.yml.j2
service_jobs: []
service_init_containers: []
secrets:
  env:
    - name: OPENBAO_INIT_RECOVERY_PASSPHRASE
      value: "{{ openbao_recovery_passphrase }}"
  files:
    - name: openbao-config.hcl
      target: /etc/openbao/config.d/server.hcl
      mode: '0600'
      value: "{{ openbao_config_template }}"
    - name: openbao-tls-chain.crt
      target: "{{ openbao_tls_cert_path }}"
      mode: '0600'
      value: "{{ openbao_tls_cert }}"
    - name: openbao-tls.key
      target: "{{ openbao_tls_key_path }}"
      mode: '0600'
      value: "{{ openbao_tls_key }}"

openbao_service_port: 8200
openbao_cluster_port: 8201
openbao_config_volume: openbao-config
openbao_data_volume: openbao-data
openbao_config_volume_size_gb: 2
openbao_data_volume_size_gb: 20
openbao_container_vmid: 250
openbao_container_ip: 192.168.100.16
openbao_container_gateway: 192.168.100.1
openbao_container_cidr: 24
openbao_container_bridge: vmbr0
openbao_container_interface: eth0
openbao_container_cpu_cores: 2
openbao_container_memory_mb: 4096
openbao_container_swap_mb: 4096
openbao_container_storage_gb: "{{ openbao_config_volume_size_gb + openbao_data_volume_size_gb }}"
openbao_container_template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
openbao_disable_mlock: "{{ lookup('env', 'OPENBAO_DISABLE_MLOCK') | default(false, true) | bool }}"
openbao_enable_ui: "{{ lookup('env', 'OPENBAO_ENABLE_UI') | default(true, true) | bool }}"
openbao_log_level: "{{ lookup('env', 'OPENBAO_LOG_LEVEL') | default('warn', true) }}"
openbao_tls_disable: "{{ lookup('env', 'OPENBAO_TLS_DISABLE') | default(false, true) | bool }}"
openbao_timezone: "{{ lookup('env', 'OPENBAO_TZ') | default('UTC', true) }}"
openbao_production: "{{ lookup('env', 'OPENBAO_PRODUCTION') | default(false, true) | bool }}"
openbao_api_addr: "{{ lookup('env', 'OPENBAO_API_ADDR') | default((openbao_tls_disable | bool) | ternary('http://' ~ service_ip ~ ':' ~ (openbao_service_port | string), 'https://' ~ service_ip ~ ':' ~ (openbao_service_port | string)), true) }}"
openbao_cluster_addr: "{{ lookup('env', 'OPENBAO_CLUSTER_ADDR') | default((openbao_tls_disable | bool) | ternary('http://' ~ service_ip ~ ':' ~ (openbao_cluster_port | string), 'https://' ~ service_ip ~ ':' ~ (openbao_cluster_port | string)), true) }}"
openbao_external_url: "{{ lookup('env', 'OPENBAO_URL') | default((openbao_tls_disable | bool) | ternary('http://' ~ service_ip ~ ':' ~ (openbao_service_port | string), 'https://' ~ service_ip ~ ':' ~ (openbao_service_port | string)), true) }}"
openbao_health_scheme: "{{ (openbao_tls_disable | bool) | ternary('http', 'https') }}"
openbao_raft_node_id: "{{ lookup('env', 'OPENBAO_RAFT_NODE_ID') | default('', true) }}"
openbao_recovery_passphrase: "{{ lookup('env', 'OPENBAO_RECOVERY_PASSPHRASE') | default('', true) }}"
openbao_tls_cert: "{{ lookup('env', 'OPENBAO_TLS_CERT') | default('', true) }}"
openbao_tls_key: "{{ lookup('env', 'OPENBAO_TLS_KEY') | default('', true) }}"
openbao_tls_cert_path: /etc/openbao/tls/tls-chain.crt
openbao_tls_key_path: /etc/openbao/tls/tls.key
openbao_listen_address: "{{ lookup('env', 'OPENBAO_LISTEN_ADDRESS') | default('0.0.0.0', true) }}"
openbao_effective_raft_node_id: >-
  {{
    (openbao_raft_node_id | default(''))
    if (openbao_raft_node_id | default('') | length > 0)
    else (lookup('env', 'HOSTNAME') | default(service_name ~ '-0', true))
  }}
openbao_raft_join_enabled: true
openbao_headless_leader_host: "{{ service_name }}-0.{{ service_name }}-headless.{{ openbao_kubernetes_namespace }}.svc.cluster.local"
openbao_raft_join_endpoint: "{{ lookup('env', 'OPENBAO_RAFT_JOIN_ENDPOINT') | default(openbao_health_scheme ~ '://' ~ openbao_headless_leader_host ~ ':' ~ (openbao_service_port | string), true) }}"
openbao_auto_unseal_method: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_METHOD') | default('', true) }}"
openbao_auto_unseal_config:
  region: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_REGION') | default('', true) }}"
  kms_key_id: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_KMS_KEY_ID') | default('', true) }}"
  endpoint: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_ENDPOINT') | default('', true) }}"
  tenant_id: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_TENANT_ID') | default('', true) }}"
  vault_name: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_VAULT_NAME') | default('', true) }}"
  key_name: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_KEY_NAME') | default('', true) }}"
  key_version: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_KEY_VERSION') | default('', true) }}"
  project: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_PROJECT') | default('', true) }}"
  key_ring: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_KEY_RING') | default('', true) }}"
  crypto_key: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_CRYPTO_KEY') | default('', true) }}"
openbao_auto_unseal_credentials:
  access_key: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_ACCESS_KEY') | default('', true) }}"
  secret_key: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_SECRET_KEY') | default('', true) }}"
  client_id: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_CLIENT_ID') | default('', true) }}"
  client_secret: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_CLIENT_SECRET') | default('', true) }}"
  credentials_json: "{{ lookup('env', 'OPENBAO_AUTO_UNSEAL_CREDENTIALS_JSON') | default('', true) }}"
openbao_snapshot_settings:
  enabled: false
  schedule: "0 3 * * *"
  retention: 7
  storage_path: /var/lib/openbao/snapshots
  secure_export_secret: "{{ lookup('env', 'OPENBAO_SNAPSHOT_EXPORT_SECRET') | default('', true) }}"
  job_image: docker.io/openbao/openbao:2.4.1
openbao_readiness_latency_threshold: 0.75
openbao_certificate_expiry_warning_days: 30
openbao_force_certificate_deploy: false
openbao_audit_device_type: "{{ lookup('env', 'OPENBAO_AUDIT_TYPE') | default('', true) }}"
openbao_audit_device_path: "{{ lookup('env', 'OPENBAO_AUDIT_PATH') | default('', true) }}"
openbao_audit_device_mode: "{{ lookup('env', 'OPENBAO_AUDIT_MODE') | default('0640', true) }}"
openbao_init_job_enabled: false
openbao_init_job_backend_secret: "{{ lookup('env', 'OPENBAO_INIT_BACKEND_SECRET') | default('', true) }}"
openbao_init_job_secure_store: "{{ lookup('env', 'OPENBAO_INIT_SECURE_STORE') | default('', true) }}"
openbao_init_job_secure_store_allowlist:
  - sops
  - vault
  - kubectl
service_jobs: "{{ ((openbao_init_job_enabled | bool) | ternary([
  {
    'name': 'openbao-initialization',
    'image': service_image,
    'command': ['/bin/sh', '-ec', 'set -euo pipefail; bao operator init -format=json | {{ openbao_init_job_secure_store }}'],
    'env': [
      {'name': 'VAULT_ADDR', 'value': openbao_api_addr},
      {'name': 'VAULT_SKIP_VERIFY', 'value': 'true' if (openbao_tls_disable | bool) else 'false'},
      {'name': 'OPENBAO_RECOVERY_PASSPHRASE', 'value': openbao_recovery_passphrase},
      {'name': 'OPENBAO_SECURE_BACKEND', 'value': openbao_init_job_backend_secret}
    ],
    'completions': 1,
    'backoff_limit': 0
  }
], [])) | to_yaml | from_yaml }}"
openbao_config_template: |
  storage "raft" {
    path    = "/var/lib/openbao/data"
    node_id = "{{ openbao_effective_raft_node_id }}"
  }

{% if openbao_auto_unseal_method == 'aws' %}
  seal "awskms" {
    region     = "{{ openbao_auto_unseal_config.region }}"
    kms_key_id = "{{ openbao_auto_unseal_config.kms_key_id }}"
{% if openbao_auto_unseal_config.endpoint %}
    endpoint   = "{{ openbao_auto_unseal_config.endpoint }}"
{% endif %}
{% if openbao_auto_unseal_credentials.access_key %}
    access_key = "{{ openbao_auto_unseal_credentials.access_key }}"
    secret_key = "{{ openbao_auto_unseal_credentials.secret_key }}"
{% endif %}
  }
{% elif openbao_auto_unseal_method == 'azure' %}
  seal "azurekeyvault" {
    tenant_id  = "{{ openbao_auto_unseal_config.tenant_id }}"
    vault_name = "{{ openbao_auto_unseal_config.vault_name }}"
    key_name   = "{{ openbao_auto_unseal_config.key_name }}"
{% if openbao_auto_unseal_config.key_version %}
    key_version = "{{ openbao_auto_unseal_config.key_version }}"
{% endif %}
{% if openbao_auto_unseal_credentials.client_id %}
    client_id     = "{{ openbao_auto_unseal_credentials.client_id }}"
    client_secret = "{{ openbao_auto_unseal_credentials.client_secret }}"
{% endif %}
  }
{% elif openbao_auto_unseal_method == 'gcp' %}
  seal "gcpckms" {
    project    = "{{ openbao_auto_unseal_config.project }}"
    region     = "{{ openbao_auto_unseal_config.region }}"
    key_ring   = "{{ openbao_auto_unseal_config.key_ring }}"
    crypto_key = "{{ openbao_auto_unseal_config.crypto_key }}"
{% if openbao_auto_unseal_credentials.credentials_json %}
    credentials = "{{ openbao_auto_unseal_credentials.credentials_json }}"
{% endif %}
  }
{% endif %}

  listener "tcp" {
    address         = "{{ openbao_listen_address }}:{{ openbao_service_port }}"
    cluster_address = "{{ openbao_listen_address }}:{{ openbao_cluster_port }}"
    tls_disable     = {{ openbao_tls_disable | bool | ternary(1, 0) }}
{% if not openbao_tls_disable | bool %}
    tls_cert_file  = "{{ openbao_tls_cert_path }}"
    tls_key_file   = "{{ openbao_tls_key_path }}"
{% endif %}
  }

  api_addr     = "{{ openbao_api_addr }}"
  cluster_addr = "{{ openbao_cluster_addr }}"
  disable_mlock = {{ openbao_disable_mlock | bool | ternary("true", "false") }}
  ui           = {{ openbao_enable_ui | bool | ternary("true", "false") }}
  log_level    = "{{ openbao_log_level }}"

{% if openbao_audit_device_type and openbao_audit_device_path %}
  audit "{{ openbao_audit_device_type }}" {
    path = "{{ openbao_audit_device_path }}"
    mode = "{{ openbao_audit_device_mode }}"
  }
{% endif %}

openbao_baremetal_config_path: "/etc/openbao/config.d/server.hcl"
openbao_kubernetes_namespace: security
openbao_kubernetes_replicas: 1
