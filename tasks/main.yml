---
- name: Validate service contract
  include_role:
    name: common.validate_schema

- name: Enforce secure defaults in production
  assert:
    that:
      - "{{ not (openbao_tls_disable | bool) }}"
      - "{{ not (openbao_disable_mlock | bool) }}"
      - "{{ (openbao_kubernetes_replicas | int) >= 3 }}"
    fail_msg: >-
      Production deployments require TLS, mlock, and at least three replicas. Adjust openbao_tls_disable, openbao_disable_mlock, and openbao_kubernetes_replicas accordingly.
  when: openbao_production | bool

- name: Ensure TLS assets provided when TLS is enabled
  assert:
    that:
      - "{{ openbao_tls_cert | length > 0 }}"
      - "{{ openbao_tls_key | length > 0 }}"
    fail_msg: TLS is enabled but certificate or key material was not provided.
  when: not openbao_tls_disable | bool

- name: Validate TLS certificate and key material
  when: not openbao_tls_disable | bool
  block:
    - name: Parse TLS certificate
      ansible.builtin.openssl_certificate_info:
        content: "{{ openbao_tls_cert }}"
      register: openbao_tls_cert_info

    - name: Parse TLS private key
      ansible.builtin.openssl_privatekey_info:
        content: "{{ openbao_tls_key }}"
      register: openbao_tls_key_info

    - name: Ensure certificate and key pair match
      assert:
        that:
          - openbao_tls_cert_info.public_key is defined
          - openbao_tls_key_info.public_key is defined
          - openbao_tls_cert_info.public_key == openbao_tls_key_info.public_key
        fail_msg: TLS certificate and key do not share the same public key material.

    - name: Capture current epoch for certificate checks
      command: date +%s
      register: openbao_current_epoch
      changed_when: false

    - name: Evaluate certificate expiry window
      set_fact:
        openbao_certificate_seconds_remaining: "{{ (openbao_tls_cert_info.not_after_timestamp | int) - (openbao_current_epoch.stdout | int) }}"

    - name: Enforce minimum certificate validity window
      assert:
        that:
          - openbao_force_certificate_deploy | bool or (openbao_certificate_seconds_remaining | int) >= 604800
        fail_msg: TLS certificate expires in fewer than 7 days. Rotate the certificate or set openbao_force_certificate_deploy: true.

    - name: Warn about upcoming certificate expiration
      when: (openbao_certificate_seconds_remaining | int) < (openbao_certificate_expiry_warning_days * 86400)
      debug:
        msg: >-
          TLS certificate expires within {{ openbao_certificate_expiry_warning_days }} days; rotate it to avoid outages.
        warn: true
- name: Validate recovery passphrase complexity
  assert:
    that:
      - "{{ openbao_recovery_passphrase | length >= 16 }}"
      - "{{ openbao_recovery_passphrase | regex_search('[A-Z]') is not none }}"
      - "{{ openbao_recovery_passphrase | regex_search('[a-z]') is not none }}"
      - "{{ openbao_recovery_passphrase | regex_search('[0-9]') is not none }}"
      - "{{ openbao_recovery_passphrase | regex_search('[^A-Za-z0-9]') is not none }}"
    fail_msg: >-
      OPENBAO_INIT_RECOVERY_PASSPHRASE must be at least 16 characters and include upper, lower, numeric, and special characters.

- name: Warn about insufficient Raft replicas
  when: (openbao_kubernetes_replicas | int) < 3
  debug:
    msg: >-
      OpenBao Raft deployments require at least 3 replicas for high availability. Increase openbao_kubernetes_replicas for production.
    warn: true

- name: Derive cluster address host
  set_fact:
    openbao_cluster_host: "{{ openbao_cluster_addr | regex_replace('^https?://', '') | regex_replace('/.*$', '') | regex_replace(':.*$', '') }}"

- name: Validate cluster address routability
  assert:
    that:
      - "{{ openbao_cluster_host not in ['127.0.0.1', '0.0.0.0', 'localhost'] }}"
    fail_msg: >-
      openbao_cluster_addr must be reachable by peer nodes. Configure a routable address instead of {{ openbao_cluster_host }}.

- name: Validate auto-unseal configuration
  when: openbao_auto_unseal_method | length > 0
  block:
    - name: Assert required auto-unseal parameters are present
      assert:
        that:
          - "{{ (
                (openbao_auto_unseal_method == 'aws' and openbao_auto_unseal_config.region and openbao_auto_unseal_config.kms_key_id)
                or (openbao_auto_unseal_method == 'azure' and openbao_auto_unseal_config.tenant_id and openbao_auto_unseal_credentials.client_id and openbao_auto_unseal_credentials.client_secret and openbao_auto_unseal_config.vault_name and openbao_auto_unseal_config.key_name)
                or (openbao_auto_unseal_method == 'gcp' and openbao_auto_unseal_config.project and openbao_auto_unseal_config.region and openbao_auto_unseal_config.key_ring and openbao_auto_unseal_config.crypto_key)
              ) }}"
        fail_msg: >-
          openbao_auto_unseal_method is set to {{ openbao_auto_unseal_method }} but required configuration or credentials are missing.

    - name: Validate AWS auto-unseal identifiers
      when: openbao_auto_unseal_method == 'aws'
      assert:
        that:
          - openbao_auto_unseal_config.kms_key_id is match('^arn:aws(-[a-z]+)?:kms:[a-z0-9-]+:\d{12}:key/[0-9a-fA-F-]{36}$')
        fail_msg: AWS KMS key identifiers must be full ARNs (arn:aws:kms:region:account:key/uuid).

    - name: Validate Azure auto-unseal identifiers
      when: openbao_auto_unseal_method == 'azure'
      assert:
        that:
          - openbao_auto_unseal_config.vault_name is match('^[a-z0-9-]{3,24}$')
          - openbao_auto_unseal_config.key_name is match('^[A-Za-z0-9-]+$')
        fail_msg: Azure Key Vault names must be 3-24 lowercase alphanumeric or hyphen characters; key names must be alphanumeric plus hyphen.

    - name: Validate GCP auto-unseal identifiers
      when: openbao_auto_unseal_method == 'gcp'
      assert:
        that:
          - openbao_auto_unseal_config.project is match('^[a-z][a-z0-9-]{4,28}[a-z0-9]$')
          - openbao_auto_unseal_config.key_ring is match('^[a-zA-Z0-9_-]{1,63}$')
          - openbao_auto_unseal_config.crypto_key is match('^[a-zA-Z0-9_-]{1,63}$')
        fail_msg: GCP project, key ring, and crypto key names must follow Cloud KMS naming conventions.

    - name: Warn when static auto-unseal credentials are supplied
      when: >-
        (openbao_auto_unseal_method == 'aws' and (openbao_auto_unseal_credentials.access_key | length > 0 or openbao_auto_unseal_credentials.secret_key | length > 0))
        or (openbao_auto_unseal_method == 'azure' and (openbao_auto_unseal_credentials.client_id | length > 0 or openbao_auto_unseal_credentials.client_secret | length > 0))
        or (openbao_auto_unseal_method == 'gcp' and openbao_auto_unseal_credentials.credentials_json | length > 0)
      debug:
        msg: >-
          Static credentials were provided for auto-unseal. Prefer IAM roles or workload identity federation to avoid storing long-lived secrets in configuration.
        warn: true
- name: Ensure service job list is initialized
  set_fact:
    service_jobs: "{{ service_jobs | default([]) }}"

- name: Ensure init container list is initialized
  set_fact:
    service_init_containers: "{{ service_init_containers | default([]) }}"

- name: Configure Raft join init container
  when: openbao_raft_join_enabled | bool
  set_fact:
    service_init_containers: "{{ service_init_containers + [
      {
        'name': 'openbao-raft-join',
        'image': service_image,
        'command': ['/bin/sh', '-ec', 'set -euo pipefail; rc=0; bao operator raft join \"$VAULT_LEADER_ADDR\" || rc=$?; if [ \"$rc\" -eq 0 ]; then exit 0; elif [ \"$rc\" -eq 2 ]; then echo \"Raft join already completed\"; else exit \"$rc\"; fi'],
        'env': [
          {'name': 'VAULT_ADDR', 'value': openbao_api_addr},
          {'name': 'VAULT_LEADER_ADDR', 'value': openbao_raft_join_endpoint},
          {'name': 'VAULT_SKIP_VERIFY', 'value': 'true' if (openbao_tls_disable | bool) else 'false'}
        ]
      }
    ] }}"

- name: Configure scheduled Raft snapshot job
  when: openbao_snapshot_settings.enabled | bool
  block:
    - name: Validate snapshot job configuration
      assert:
        that:
          - "{{ openbao_snapshot_settings.schedule | length > 0 }}"
          - "{{ openbao_snapshot_settings.storage_path | length > 0 }}"
        fail_msg: >-
          Snapshot automation requires both a cron schedule and storage_path.

    - name: Ensure secure export secret is defined when requested
      when: openbao_snapshot_settings.secure_export_secret | length == 0
      debug:
        msg: >-
          No secure_export_secret configured for snapshot job; snapshots will remain local to {{ openbao_snapshot_settings.storage_path }}.
        warn: true

    - name: Append snapshot job definition
      set_fact:
        service_jobs: "{{ service_jobs + [
          {
            'name': 'openbao-raft-snapshot',
            'schedule': openbao_snapshot_settings.schedule,
            'image': openbao_snapshot_settings.job_image,
            'command': ['/bin/sh', '-ec', 'set -euo pipefail; bao operator raft snapshot save --path {{ openbao_snapshot_settings.storage_path }}; {% if openbao_snapshot_settings.retention | int > 0 %}find {{ openbao_snapshot_settings.storage_path }} -type f -mtime +{{ openbao_snapshot_settings.retention }} -delete{% else %}true{% endif %}'],
            'env': (
              [
                {'name': 'VAULT_ADDR', 'value': openbao_api_addr},
                {'name': 'VAULT_SKIP_VERIFY', 'value': 'true' if (openbao_tls_disable | bool) else 'false'},
                {'name': 'OPENBAO_RECOVERY_PASSPHRASE', 'value': openbao_recovery_passphrase}
              ]
              + ([{'name': 'OPENBAO_SNAPSHOT_EXPORT_SECRET', 'value': openbao_snapshot_settings.secure_export_secret}] if (openbao_snapshot_settings.secure_export_secret | length > 0) else [])
            ),
            'retention': openbao_snapshot_settings.retention,
            'secure_export_secret': openbao_snapshot_settings.secure_export_secret
          }
        ] }}"
- name: Validate automated initialization job configuration
  when: openbao_init_job_enabled | bool
  block:
    - name: Ensure secure storage command is provided
      assert:
        that:
          - "{{ openbao_init_job_secure_store | length > 0 }}"
        fail_msg: >-
          openbao_init_job_secure_store must contain a secure storage command to capture initialization output.

    - name: Validate secure storage command allowlist
      vars:
        openbao_init_job_secure_store_command: "{{ (openbao_init_job_secure_store | regex_replace('^[\s;|&]+', '')).split() | first | default('') }}"
      assert:
        that:
          - openbao_init_job_secure_store_command in openbao_init_job_secure_store_allowlist
        fail_msg: >-
          openbao_init_job_secure_store must begin with an approved command ({{ openbao_init_job_secure_store_allowlist | join(', ') }}).
- name: Determine target runtimes
  vars:
    candidate_runtimes: "{{ runtime | default(target_runtimes | default(runtime_templates.keys() | list)) }}"
  set_fact:
    service_target_runtimes: "{{ candidate_runtimes if (candidate_runtimes is iterable and candidate_runtimes is not string) else [candidate_runtimes] }}"

- name: Set infrastructure template root
  set_fact:
    infrastructure_template_root: "{{ [role_path | dirname, 'infrastructure', 'templates'] | path_join }}"

- name: Build runtime template map
  set_fact:
    service_runtime_templates: "{{ service_runtime_templates | default({}) | combine({ item.key: ([infrastructure_template_root, item.value] | path_join) }) }}"
  loop: "{{ runtime_templates | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure requested runtimes are supported
  assert:
    that:
      - runtime_item in service_runtime_templates
    fail_msg: "Runtime {{ runtime_item }} not supported by service {{ service_id }}"
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item

- name: Render and apply runtime(s)
  loop: "{{ service_target_runtimes }}"
  loop_control:
    loop_var: runtime_item
    label: "{{ runtime_item }}"
  block:
    - name: Render runtime {{ runtime_item }}
      include_role:
        name: common.render_runtime
      vars:
        runtime_templates: "{{ service_runtime_templates }}"
        runtime: "{{ runtime_item }}"

    - name: Apply runtime {{ runtime_item }}
      include_role:
        name: common.apply_runtime
      vars:
        runtime: "{{ runtime_item }}"
